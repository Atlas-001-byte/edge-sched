[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-sched"
version = "0.1.0"
description = "高并发调度框架：事件循环、背压与延迟分布统计"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edge-sched = "edge_sched.__main__:main"

[tool.setuptools]
packages = ["edge_sched"]
